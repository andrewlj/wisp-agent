# wisp daily briefing — news sources and filter configuration
# Edit this file to add/remove sections, swap sources, or tune filters.
# briefing.py reads this at startup; no Python changes needed for new sections.
#
# Filter fields (all optional):
#   trusted_sources:   list of source names that pass without keyword checks
#   excl_keywords:     any match → reject
#   strong_keywords:   any match → pass immediately (after excl check)
#   prefer_sources:    sources with a lower keyword threshold
#   prefer_title_min:  min local_keyword hits in title for prefer_sources (default 1)
#   prefer_local_min:  min local_keyword hits in text for prefer_sources (default 0)
#   title_required:    non-trusted sources must have at least one of these in title
#   title_bypass_count: if title hits >= N, skip sig_min check (0 = disabled)
#   url_inc:           URL path inclusion patterns (counts as local match)
#   url_excl:          URL path exclusion patterns (applied first)
#   local_keywords:    primary keyword pool
#   sig_keywords:      secondary "significance" keyword pool
#   local_min:         min local_keywords hits required (default 0 = no check)
#   title_min:         min local_keywords hits in title required (default 0)
#   sig_min:           min sig_keywords hits required (default 0)

sections:

  - id: political
    label: "🌍 政治国际"
    div_id: "political-international"
    per_source_cap: 2
    sources:
      - {type: rss,  url: "https://feeds.bbci.co.uk/news/world/rss.xml",   hostname: "bbc.co.uk"}
      - {type: rss,  url: "https://feeds.bbci.co.uk/news/rss.xml",         hostname: "bbc.co.uk"}
      - {type: page, url: "https://apnews.com/world-news",                 hostname: "apnews.com", url_pattern: "/article/"}
      - {type: page, url: "https://apnews.com/politics",                   hostname: "apnews.com", url_pattern: "/article/"}
    domains:
      "reuters.com": "Reuters"
      "apnews.com":  "AP News"
      "bbc.co.uk":   "BBC"
      "bbc.com":     "BBC"
      "ft.com":      "Financial Times"
      "wsj.com":     "Wall Street Journal"
    filter: {}   # no content filter — all domain-matched articles pass

