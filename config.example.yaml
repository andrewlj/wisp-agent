server:
  base_url: "http://127.0.0.1:8000/v1/chat/completions"
  api_key: "your-api-key"

model:
  name: "your-model-name"   # e.g. Qwen3.5-9B-MLX-8bit
  max_tokens: 4096
  vision: false             # set true if your model supports image input (e.g. Qwen2.5-VL)

agent:
  max_turns: 20
  bash_timeout: 30
  browser_timeout: 30               # seconds before a browser operation times out
  workspace: "~/wisp/workspace"      # all agent outputs go here
  strict_workspace: true            # block writes/deletes outside workspace
  context_limit: 6000               # estimated tokens before compression kicks in
  context_keep_recent: 6            # number of recent messages to keep verbatim
  max_tool_result_chars: 4000       # cap each tool result fed to the model so a
                                    # large output can't blow past the context
                                    # window. Lower for tiny-context models.
  # Trim the tool menu sent to the model — fewer tools = better selection on
  # small (e.g. 9B) models. `core` (bash/read_file/write_file/done) is always on.
  # Groups: system files network browser travel reminders calendar notes mail
  #         task news learn
  disabled_tool_groups: []          # e.g. [browser, travel, network] to drop 14 tools

# Optional: SerpAPI key for flight_search and hotel_search tools.
# Sign up free at https://serpapi.com/users/sign_up (100 searches/month free).
# Leave empty to disable these tools.
serpapi:
  api_key: ""
